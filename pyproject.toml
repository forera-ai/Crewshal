[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewshal"
version = "0.1.0"
description = "Passive repository discovery and human-confirmed project models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
crewshal = "crewshal.cli:main"

[project.optional-dependencies]
dev = ["mypy==1.18.2", "ruff==0.14.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/crewshal"]

[tool.ruff]
target-version = "py312"
line-length = 100
